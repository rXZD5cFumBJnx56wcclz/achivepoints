[package]
name = "achivepoints"
version = "0.1.1"
edition = "2024"

[dependencies]
tokio = {version = "1", features=["full"]}
rand = "0.9"
serde_json5 = "0.1"
serde_json = "1"
serde = {version = "1", features = ["derive"]}
clap = {version ="4", features = ["derive"]}
serde_with = "3"
reqwest = {version = "0.12", features = ["json"]}
shell-words = "1"
reedline = "0.40"

[dev-dependencies]
pretty_assertions = "1"